<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go-Tech — For Real Solutions | Software and Graphic Design</title>
    <meta
      name="description"
      content="Premium Software design, brand graphics, and digital tools at rates that fit a growing business. Fixed UGX quotes, launch dates in writing. Based in Uganda, serving East Africa and worldwide."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" href="/logo-blue.png" />
    <link rel="apple-touch-icon" href="/logo-blue.png" />
    <meta name="theme-color" content="#ffffff" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gotech_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
